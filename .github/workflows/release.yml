name: EMS approved image release
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish-tested-images to authorize GHCR publication (not deployment)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ems-image-release
  cancel-in-progress: false
jobs:
  approval-policy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'publish-tested-images'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node deploy/tests/github-approval.mjs release policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
  publish:
    needs: approval-policy
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify actual independent approval before publishing
        run: node deploy/tests/github-approval.mjs release approved
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '[.workflow_runs[] | select(.head_branch == "main" and (.event == "push" or .event == "workflow_dispatch"))] | length')
          test "$count" -ge 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build and test exactly the images to publish
        run: |
          docker build -f apps/api/Dockerfile -t ems-prep-api:20261105 .
          docker build -f apps/web/Dockerfile -t ems-prep-web:20261105 .
          docker build -f deploy/postgres/Dockerfile -t ems-prep-db:20261105 .
          node deploy/tests/container-smoke.mjs
          for image in ems-prep-api:20261105 ems-prep-web:20261105 ems-prep-db:20261105; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --db-repository public.ecr.aws/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$image"
          done
      - name: Publish immutable commit tags and record digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          for component in api web db; do
            image="$prefix-$component:$GITHUB_SHA"
            docker tag "ems-prep-$component:20261105" "$image"
            docker push "$image"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
            printf '%s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
          done
          printf 'Deployment remains a separate approved operation on VM 101.\n' >> "$GITHUB_STEP_SUMMARY"
