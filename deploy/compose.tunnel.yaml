# No host ports. Requires an approved Cloudflare DNS topology and pinned image.
services:
  tunnel:
    labels: { com.ebonstudio.ems: "true" }
    image: ${EMS_TUNNEL_IMAGE:?Set verified cloudflare/cloudflared digest}
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run", "--token-file", "/run/secrets/tunnel_token"]
    secrets: [tunnel_token]
    networks: [ingress]
    depends_on:
      web: { condition: service_healthy }
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
secrets:
  tunnel_token: { file: "${EMS_RUNTIME_DIR}/secrets/tunnel_token" }
