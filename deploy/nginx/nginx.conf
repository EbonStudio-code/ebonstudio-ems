worker_processes auto;
pid /tmp/nginx.pid;
# Request lines, query strings and headers never enter proxy logs.
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  sendfile on;
  client_max_body_size 64k;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 15s;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  resolver 127.0.0.11 valid=10s ipv6=off;
  # Ingress MUST overwrite X-Real-IP and reject direct public origin access.
  # Cloudflare Tunnel supplies CF-Connecting-IP; no host port is exposed in that mode.
  map $http_cf_connecting_ip $ingress_ip {
    "" $http_x_real_ip;
    default $http_cf_connecting_ip;
  }
  map $ingress_ip $client_ip {
    "" $remote_addr;
    default $ingress_ip;
  }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Cache-Control "no-store" always;
  server {
    listen 8080 default_server;
    server_name _;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 444; }
  }
  server {
    listen 8080;
    server_name ems.ebonstudio.com;
    root /usr/share/nginx/html;
    location = /healthz { return 200 "ok\n"; }
    location ^~ /api/v1/health/ready { return 404; }
    location = /api { return 404; }
    location /api/ {
      set $api http://api:3000;
      proxy_pass $api$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host ems.ebonstudio.com;
      proxy_set_header X-Forwarded-Host ems.ebonstudio.com;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header Connection "";
      proxy_set_header X-Readiness-Key "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      proxy_buffering off;
    }
    location ~* ^/(preview|concepts|tests)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(map|sql|env|log)$ { return 404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
